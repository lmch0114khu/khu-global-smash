<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>경희대 국제캠퍼스 부수기</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #bcd9f0; font-family: "Malgun Gothic", system-ui, sans-serif; }
    canvas { display: block; }
    .hud { position: fixed; padding: 8px 12px; background: rgba(20, 24, 32, 0.6); color: #fff; font-size: 13px; line-height: 1.5; border-radius: 6px; pointer-events: none; }
    #help { left: 8px; top: 8px; display: grid; grid-template-columns: auto auto; gap: 3px 7px; align-items: center; padding: 6px 8px; font-size: 11px; line-height: 1.3; }
    #help kbd { min-width: 34px; padding: 1px 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); font: inherit; font-weight: bold; text-align: center; }
    #credit { right: 4px; bottom: 3px; padding: 0; background: none; font-size: 9px; line-height: 1.2; pointer-events: auto; }
    #credit a { color: rgba(255, 255, 255, 0.8); text-decoration: none; text-shadow: 0 0 2px rgba(0, 0, 0, 0.7); }
    #labels { position: fixed; top: 0; left: 0; pointer-events: none; }
    #panel { right: 8px; top: 8px; width: 92px; padding: 5px 7px; font-size: 10px; line-height: 1.4; pointer-events: auto; }
    #panel h1 { margin: 0; font-size: 10px; font-weight: normal; opacity: 0.8; }
    #total { font-size: 15px; font-weight: bold; line-height: 1.2; }
    #list { margin: 2px 0 4px; padding: 0; list-style: none; }
    #list li { position: relative; display: flex; justify-content: space-between; padding: 0 3px; margin-top: 1px; }
    #list i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255, 90, 60, 0.35); border-radius: 2px; z-index: -1; }
    #list span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 4px; }
    #panel .row { display: block; margin-bottom: 4px; }
    #panel .row b { float: right; }
    #panel .row input { display: block; width: 100%; height: 10px; margin: 1px 0 0; }
    #panel .row:last-child { margin-bottom: 0; }
    .label { padding: 0 5px; background: rgba(20, 24, 32, 0.3); color: rgba(255, 255, 255, 0.92); font-size: 10px; line-height: 15px; border-radius: 7px; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="help" class="hud">
    <kbd>클릭</kbd><span>미사일 발사</span>
    <kbd>왼쪽</kbd><span>이동</span>
    <kbd>오른쪽</kbd><span>회전</span>
    <kbd>휠</kbd><span>확대·축소</span>
    <kbd>R</kbd><span>리셋</span>
  </div>
  <div id="panel" class="hud">
    <h1>전체 파괴율</h1>
    <div id="total">0.0%</div>
    <ul id="list"></ul>
    <label class="row">폭발 반경 <b id="radiusVal">24m</b><input id="radius" type="range" min="6" max="48" step="2" value="24" /></label>
    <label class="row">미사일 속도 <b id="speedVal">1.00×</b><input id="speed" type="range" min="0.25" max="3" step="0.25" value="1" /></label>
    <label class="row" title="잔해가 된 뒤 폭발에 몇 번 더 휘말리면 가루로 사라질지. 0: 멈추면 바로 사라짐, 불가: 사라지지 않음">잔해 소멸 <b id="hitsVal">2번</b><input id="hits" type="range" min="0" max="10" step="1" value="2" /></label>
    <label class="row">음량 <b id="volumeVal">50%</b><input id="volume" type="range" min="0" max="100" step="5" value="50" /></label>
  </div>
  <!-- OSM 데이터(ODbL)를 쓰는 지도는 화면에 출처를 보여야 한다. 표고(NASA SRTM, 공공 영역) 등 나머지 출처는 README에. -->
  <div id="credit" class="hud"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
